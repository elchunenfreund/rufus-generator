[project]
name = "rufus-generator"
version = "0.1.0"
description = "Amazon Rufus/COSMOS listing generator with vision AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "anthropic>=0.42.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.36.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=2.1.0",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
