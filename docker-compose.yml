services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q bulk,interactive
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rufus_generator
      POSTGRES_USER: rufus
      POSTGRES_PASSWORD: rufus_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  uploads:
